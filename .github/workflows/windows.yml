name: Windows builds

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-2025
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          architecture: x64
      - run: python -m pip install -r requirements-build.txt
      - run: python -m unittest discover -v
        env:
          QT_QPA_PLATFORM: offscreen
      - run: python packaging/build_windows.py --portable-exe
        env:
          QT_QPA_PLATFORM: offscreen
      - name: Verify installer and startup shortcuts
        shell: pwsh
        run: |
          $installer = Get-ChildItem release -Filter '*-Setup.exe'
          ./packaging/test_installer.ps1 -Installer $installer.FullName
      - uses: actions/upload-artifact@v6
        with:
          name: lysnav-windows-x64-installer
          path: release/*-Setup.exe
          if-no-files-found: error
      - uses: actions/upload-artifact@v6
        with:
          name: lysnav-windows-x64-portable-exe
          path: release/portable-exe/
          if-no-files-found: error
